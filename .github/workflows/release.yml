name: Release

# Push a tag like v0.2.0 (matching package.json) to publish to npm, attach the
# Claude Desktop extension (luw.mcpb) to a GitHub release, and update the MCP Registry.
# npm auth is Trusted Publishing (OIDC): no NPM_TOKEN secret exists or is needed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Job-level so the registry step's `if` can see it (a step's own env isn't visible to its `if`).
      MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: npm with Trusted Publishing support (>= 11.5.1)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run check

      - name: Publish to npm (Trusted Publishing, provenance is automatic)
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "${GITHUB_REF_NAME} is already on npm; skipping publish."
          else
            npm publish --access public
          fi

      - name: Build Claude Desktop extension
        run: npm run mcpb

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" build/luw.mcpb --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to the MCP Registry
        if: env.MCP_REGISTRY_KEY != ''
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login dns --domain luw.ai --private-key "$MCP_REGISTRY_KEY"
          ./mcp-publisher publish
